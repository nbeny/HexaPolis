# Arbitrages d'identité décidés par un humain.
#
# Ce fichier est prioritaire sur la cascade automatique et rejoué à chaque
# import : une décision prise une fois n'est jamais redemandée.
#
# MERGE : les deux enregistrements désignent la même personne.
# SPLIT : ils désignent des personnes différentes, malgré ce que suggère
#         l'algorithme. Sert à verrouiller un cas d'homonymie réel.
#
# Premier usage réel (plan 5, tâche 4) : six élus du second tour des
# législatives 2024 que le ministère de l'Intérieur (DATA_GOUV) publie sous
# une forme de nom différente de celle enregistrée par l'Assemblée nationale
# (AN). Dans chaque cas, la circonscription désignée par le résultat
# électoral n'a qu'un seul titulaire de mandat parlementaire sous la 17e
# législature, vérifié avant d'écrire la décision (voir la requête dans le
# plan 5, tâche 4) — c'est cette vérification, et non le nom seul, qui motive
# le rapprochement.
#
# Second usage (26 août 2026) : les candidatures de PREMIER tour des six mêmes
# élus. Les six décisions initiales ne portaient que le second tour, si bien
# que ces six-là étaient les seuls députés de toute la base à n'avoir qu'un
# résultat de second tour — 441 en ont deux, 72 n'ont que le premier parce
# qu'ils ont été élus dès ce tour-là. Leur fiche présentait donc un historique
# électoral tronqué sans dire qu'il l'était, ce qui est une forme de fausse
# affirmation. Les six `sourceKey` de premier tour ont été relevées dans
# `silver.identity_match` (source DATA_GOUV, préfixe `1|`) et non déduites de
# celles du second tour : le numéro de panneau qu'elles portent est propre à
# chaque tour, et une clé devinée serait rejetée par
# `assertDecisionsAreResolvable` — ou, pire, rattacherait une autre
# candidature. Chaque circonscription concernée a été revérifiée : elle n'a
# toujours qu'un seul titulaire de mandat parlementaire sous la 17e
# législature (68 circonscriptions sur 577 en ont eu plusieurs ; aucune de ces
# six n'en fait partie).
#
# Troisième usage (26 août 2026) : cinq COMPTES DE CAMPAGNE de la CNCCFP
# (législatives de 2022) restés non rattachés. Le blocage n'est plus la forme
# du nom publiée par le ministère mais celle publiée par la CNCCFP, qui
# agglomère civilité, patronyme en majuscules et prénom dans un seul champ
# (voir `splitCnccfpName`, `packages/domain/src/cnccfp-name.ts`) et retient
# tantôt un patronyme composé que l'Assemblée nationale abrège, tantôt
# l'inverse. La CNCCFP ne publiant aucune date de naissance, le meilleur
# niveau atteignable automatiquement depuis cette source est PROBABLE, jamais
# CONFIRMED : l'arbitrage humain est le seul chemin. Conséquence de l'absence,
# et raison de cette troisième vague : la section « Financement de campagne »
# de ces cinq fiches affichait « Compte de campagne — donnée non disponible »
# alors que le compte est en base, sous un autre nom.
#
# Chaque cas a été vérifié sur trois points avant d'être écrit :
#   (a) la circonscription publiée par la CNCCFP n'a qu'un seul titulaire d'un
#       mandat parlementaire OUVERT sous la 17e législature (les 577
#       circonscriptions en ont exactement un chacune une fois les mandats
#       clos exclus — 68 en ont eu plusieurs au fil de la législature) ;
#   (b) ce même titulaire détenait déjà le mandat de cette circonscription
#       sous la 16e législature, ouvert à la date du scrutin de 2022 : il y
#       était donc bien candidat en 2022, et la candidature n'est pas celle
#       d'un rival. C'est la vérification qui manquerait le plus si elle
#       n'était pas faite — plusieurs députés de 2024 ont pris un siège
#       qu'un autre occupait en 2022 ;
#   (c) le fichier CNCCFP ne contient, ni dans cette circonscription ni
#       ailleurs en France, un autre compte dont le nom puisse être confondu
#       avec le sien.
#
# Deux cas ont été examinés et REJETÉS, sans décision écrite : les deux
# comptes déposés sous « Mme ROUSSEAU Sandrine » dans la 9e circonscription de
# Paris (`202204221`, nuance ECO, et `202204216`, nuance DVD). Ils portent
# strictement le même nom dans la même circonscription ; rien dans la source
# ne les distingue hors la nuance politique, qui est une étiquette et non un
# fait d'identité. C'est exactement le cas que la règle `uniqueInDistrict` de
# `normalize-cnccfp.ts` existe pour bloquer, et le rattachement à l'aveugle
# attribuerait à une députée les finances de campagne d'une inconnue.
