name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poligraph
          POSTGRES_PASSWORD: poligraph
          POSTGRES_DB: poligraph_test
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      # Il n'y a pas de .env en CI : packages/ingestion/vitest.config.ts et
      # apps/api/src/main.ts appellent process.loadEnvFile() sur le .env
      # racine et avalent silencieusement l'ENOENT quand il est absent. Ces
      # deux variables, une fois définies au niveau du job, sont donc lues
      # directement via process.env par les tests et par `prisma migrate
      # deploy` (Prisma ne lit pas non plus le .env racine, seul celui à côté
      # de prisma/schema.prisma) — vérifié localement en supprimant le .env
      # et en injectant les variables par le shell.
      DATABASE_URL: postgresql://poligraph:poligraph@127.0.0.1:5433/poligraph_test?schema=public
      DATABASE_URL_TEST: postgresql://poligraph:poligraph@127.0.0.1:5433/poligraph_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          # process.loadEnvFile() (utilisé par vitest.config.ts et main.ts)
          # existe sur toute la ligne Node 22 : il est apparu en 20.12/21.7,
          # donc avant la bifurcation de la 22.0.0, et il est stable depuis
          # la 22.21. Vérifié en lançant `node:22` (22.23.2) sous Docker :
          # process.loadEnvFile est bien une fonction et lève une ENOENT
          # capturable sur un fichier absent, sans avertissement.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @poligraph/db exec prisma migrate deploy
      - run: pnpm build
      - run: pnpm typecheck
      # `turbo run test` (invoqué par ce script) ne sérialise l'exécution
      # qu'à l'intérieur de chaque package (packages/ingestion/vitest.config.ts
      # met fileParallelism à false car ses suites partagent la base
      # poligraph_test). Turbo, lui, exécute par défaut les tâches `test` de
      # paquets indépendants en parallèle (vérifié : `turbo run build/typecheck`
      # entrelace bien les logs de @poligraph/db et @poligraph/domain). Ça ne
      # pose pas de problème aujourd'hui car seul @poligraph/ingestion a des
      # tests touchant la base — mais si un autre paquet (@poligraph/db ou
      # @poligraph/api) gagne des tests d'intégration sur poligraph_test, rien
      # ici ne les empêchera de tourner en même temps que ceux d'ingestion.
      - run: pnpm test
